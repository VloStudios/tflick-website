name: Sync team & YouTubers from API

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-api
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        env:
          TEAM_API_KEY: ${{ secrets.TEAM_API_KEY }}
        run: python3 scripts/sync_api.py data
      - name: Commit if changed
        run: |
          git config user.name "teamflick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/api-team.json data/api-youtubers.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Sync team/YouTubers from API" && git push)
